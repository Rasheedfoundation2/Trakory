# Render Blueprint: one-click deploy of the standalone Task Boards tool.
# Sign in at https://render.com → New → Blueprint → point at this repo's branch.
services:
    - type: web
      name: trakory-task-boards
      runtime: node
      plan: free
      rootDir: backend
      buildCommand: npm install
      startCommand: node task-boards-server.js
      envVars:
          - key: NODE_ENV
            value: production
      healthCheckPath: /health
      disk:
          name: task-boards-data
          mountPath: /opt/render/project/src/backend/data
          sizeGB: 1
# render.yaml - Render deployment configuration
services:
  - type: web
    name: trakory-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node Server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_SERVICE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
